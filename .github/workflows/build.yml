name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: al-essawi-net-android
      - run: cp al-essawi-net-android/app/build/outputs/apk/debug/app-debug.apk al-essawi-net.apk
      - uses: actions/upload-artifact@v4
        with:
          name: al-essawi-net-apk
          path: al-essawi-net.apk
